<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Perdas · Setor Elétrico</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<style>
:root{--bg:#050a14;--bg2:#0a1322;--card:#0d1a2e;--card2:#112240;--tx:#e8f0ff;--mu:#8296b8;--bd:#1c2d4d;--ac:#22d3ee;--ac2:#fbbf24;--ok:#34d399;--bad:#fb7185;--sw:272px;color-scheme:dark}
:root[data-theme="light"]{--bg:#eef3fb;--bg2:#fff;--card:#fff;--card2:#eaf1fc;--tx:#0e1b33;--mu:#5a6b88;--bd:#d6e0f0;--ac:#0a84d6;--ac2:#d97706;--ok:#0f9d62;--bad:#d4304a;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:44px 44px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 500px at 80% -10%,color-mix(in srgb,var(--ac) 20%,transparent),transparent 60%),var(--bg);opacity:.92;z-index:-1}
body.col{--sw:76px}
.app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .25s}
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--bd);z-index:40;overflow:hidden}
.brand{display:flex;align-items:center;gap:11px;padding:18px 16px;border-bottom:1px solid var(--bd);min-height:72px}
.logo{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06101f;box-shadow:0 0 18px color-mix(in srgb,var(--ac) 45%,transparent)}
.bt b{letter-spacing:2px;font-size:15px;display:block}.bt small{color:var(--mu);font-size:11px}
#collapse{margin-left:auto;background:none;border:1px solid var(--bd);color:var(--mu);border-radius:8px;width:28px;height:28px;cursor:pointer}
#nav{padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1}
.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;border:1px solid transparent;background:none;color:var(--mu);font:inherit;text-align:left;cursor:pointer;white-space:nowrap;width:100%}
.nv i{font-style:normal;font-size:19px;width:26px;text-align:center;flex:none}
.nv:hover{background:var(--card2);color:var(--tx)}
.nv.on{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 22%,transparent),transparent);border-color:color-mix(in srgb,var(--ac) 45%,transparent);color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)}
.sfoot{padding:12px 10px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.sfoot .nv{padding:9px 12px;font-size:13px}
body.col .lbl,body.col .bt,body.col #collapse{display:none}
body.col .brand{justify-content:center;padding:18px 0}
body.col .nv{justify-content:center;padding:11px 0}
.main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:30}
#burger{display:none}
h1{margin:0;font-size:21px}.sub{color:var(--mu);font-size:12px}
.acts{margin-left:auto;display:flex;gap:8px}
#app{padding:20px 26px 40px;max-width:1700px}
.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px 13px;cursor:pointer;font:inherit;white-space:nowrap}
.btn:hover{border-color:var(--ac);box-shadow:0 0 12px color-mix(in srgb,var(--ac) 30%,transparent)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:14px;margin-bottom:16px;background:var(--card);border:1px solid var(--bd);border-radius:14px}
label{display:flex;flex-direction:column;font-size:10.5px;color:var(--mu);gap:4px;text-transform:uppercase;letter-spacing:.7px}
select,input[type=text],input[type=search]{background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;font:inherit;min-width:150px;outline:none}
select:focus,input:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin-bottom:16px}
.kpi{position:relative;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:14px;padding:14px 16px;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac)}
.kpi small{color:var(--mu);text-transform:uppercase;font-size:10.5px;letter-spacing:.7px}
.kpi div{font-size:26px;font-weight:700;margin-top:2px}
.kpi.w::after{background:var(--ac2)}.kpi.g::after{background:var(--ok)}.kpi.r::after{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:14px}
.tw{overflow:auto;height:calc(100vh - 380px);min-height:420px;max-height:900px}
.tw.free{height:auto;max-height:none;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:9px 12px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{background:var(--card2);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);position:sticky;top:0;z-index:2}
thead tr:nth-child(2) th{top:33px}
th.c{text-align:center;border-left:1px solid var(--bd)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.sep{border-left:1px solid var(--bd)}
tr.t td{font-weight:700;background:var(--card2)}
tbody tr:hover td{background:color-mix(in srgb,var(--ac) 8%,var(--card))}
.pill{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;display:inline-block}
.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.wr{background:color-mix(in srgb,var(--ac2) 22%,transparent);color:var(--ac2)}
.ac{background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac)}
.mu{color:var(--mu)}.me{color:var(--ac2)}
td.up{color:var(--bad)}td.dn{color:var(--ok)}span.dn{color:var(--ok)}span.up{color:var(--bad)}
.db{height:7px;border-radius:5px;background:linear-gradient(90deg,var(--ac),var(--ac2));min-width:2px}
.hint{color:var(--mu);font-size:12px;margin:8px 2px 14px}
.note{padding:12px 16px;border:1px dashed var(--ac2);border-radius:12px;color:var(--ac2);margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--tx);padding:8px 12px;border:1px solid var(--bd);border-radius:99px;cursor:pointer;background:var(--bg2)}
.chip.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent)}
.chip span{color:var(--mu);font-size:12px}.chip input{accent-color:var(--ac)}
tr.cl{cursor:pointer}
.ex{background:none;border:1px solid var(--bd);color:var(--ac);border-radius:6px;cursor:pointer;width:26px;height:26px;margin-right:6px}
.stk{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--bg2);min-width:4px}
.stk b{display:block;height:100%}
.sub-t td{background:var(--bg2)}
td select,td input[type=text]{min-width:0;padding:6px 8px}
td input[type=text]{width:260px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mu);padding:12px 16px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.ov{display:none}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside{position:fixed;left:0;top:0;width:276px;transform:translateX(-100%);transition:transform .25s;box-shadow:12px 0 40px #0008}
 body.open aside{transform:none}
 body.open .ov{display:block;position:fixed;inset:0;background:#0007;z-index:35}
 body.col .lbl,body.col .bt{display:revert}body.col #collapse{display:none}
 body.col .nv{justify-content:flex-start;padding:11px 12px}
 #burger{display:inline-block}#expand{display:none}.top,#app{padding-left:14px;padding-right:14px}
 .tw{height:calc(100vh - 300px)}
}
</style>
</head>
<body>
<div class="app">
 <aside id="side">
  <div class="brand"><div class="logo">⚡</div><div class="bt"><b>PERDAS</b><small>Gestão &amp; Medição</small></div><button id="collapse" title="Recolher menu">«</button></div>
  <nav id="nav"></nav>
  <div class="sfoot">
   <button class="nv" id="csv" title="Exportar base completa"><i>⬇</i><span class="lbl">Exportar base (CSV)</span></button>
   <button class="nv" id="theme" title="Alternar tema"><i>◐</i><span class="lbl">Tema claro / escuro</span></button>
  </div>
 </aside>
 <div class="ov" id="ov"></div>
 <div class="main">
  <header class="top">
   <button class="btn" id="burger">☰</button>
   <button class="btn" id="expand" title="Abrir/recolher menu">☰</button>
   <div><h1 id="ttl"></h1><div class="sub" id="tsub"></div></div>
   <div class="acts"><button class="btn" id="reload">↻ Recarregar base</button></div>
  </header>
  <div style="padding:10px 26px 0" class="sub" id="meta">Carregando base…</div>
  <div id="app"></div>
 </div>
</div>
<script src="js/xlsx.full.min.js"></script>
<script>
/* ============ CONFIGURAÇÃO ============ */
const BASE_URL='dados/BASE_PERDAS.xlsx';      // base (Excel)
const METAS_URL='dados/METAS.csv';            // metas por seccional 
const TRAT_URL='dados/tratativas.csv';        // tratativas compartilhadas
const OPT=['PENDENTE','NÃO REFATURA','ENVIADO PARA REFATURAMENTO']; // opções da coluna TRATATIVA
const RECUPERA_PADRAO=['ENVIADO PARA REFATURAMENTO'];               // tratativas que abatem a perda na Previsão
const GG='GESTÃO',GM='MEDIÇÃO';
/* ====================================================== */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:1});
const S={rows:[],cols:[],trat:{},metas:{},tab:'v1',sec:'',q:'',tr:'',sit:'',pg:'100',open:null,meta:null,ok:false,
 st:{v1:'COM PERDA',v2:'COM PERDA',v3:'COM PERDA',v4:'',v5:'',v6:''},inc:{}};
RECUPERA_PADRAO.forEach(o=>S.inc[o]=true);
const TABS=[['v1','Perdas × Grupo CNL','📊','Perda definitiva por seccional, com meta e desvio'],
 ['v2','Tratativas','🛠️','Planilha de tratativas das instalações com perda'],
 ['v3','Previsão de recuperação','🎯','Previsão de fechamento conforme as tratativas'],
 ['v4','Apontamentos × Grupo CNL','🔢','Quantidade de apontamentos por seccional'],
 ['v5','Apontamentos por agente','👷','Ranking de agentes — clique para extrair o CSV'],
 ['v6','Troca de apontamento','🔄','ANT1 × apontamento atual'],
 ['v7','Base de dados','🗄️','Arquivos, exportação e tratativas']];
const key=r=>r.REFERENCIA+'_'+r.INSTALACAO;
const P=r=>+r['PERDA DEFINITIVA']||0;
const tr=r=>S.trat[key(r)]||{t:'PENDENTE',o:''};
const cod=r=>String(r.APONTAMENTO||'').trim().slice(0,3);
const uniq=a=>[...new Set(a.filter(Boolean))].sort();
const sum=a=>a.reduce((s,x)=>s+P(x),0);
const num=v=>{if(v==null||v==='')return null;let s=String(v).trim().replace(/\s/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?null:n};
const meta=(s,t)=>{const m=S.metas[s]||{};if(t==='T')return m.T!=null?m.T:(m.G||0)+(m.M||0);return m[t]||0};

/* ---------- dadosS ---------- */
function parseCsv(t){
  t=t.replace(/^\ufeff/,'');const sep=t.split('\n')[0].includes(';')?';':',';const out=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;else if(c==sep){row.push(f);f=''}
    else if(c=='\n'){row.push(f.replace(/\r$/,''));out.push(row);row=[];f=''}else f+=c}
  if(f||row.length){row.push(f.replace(/\r$/,''));out.push(row)}
  return out.filter(r=>r.some(x=>x!==''));
}
const LS='perdas_tratativas_v1';let fileTrat={};
function mergeTrat(){let l={};try{l=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}S.trat={...fileTrat,...l}}
async function getText(u){const r=await fetch(u+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(u+' (HTTP '+r.status+')');return r}
async function loadBase(silent){
  try{
    const res=await getText(BASE_URL),lm=res.headers.get('Last-Modified'),buf=await res.arrayBuffer(),sig=buf.byteLength+'|'+lm;
    const changed=!(silent&&S.sig===sig);S.sig=sig;
    if(changed){
      const wb=XLSX.read(buf,{type:'array'});
      S.rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:null,raw:true});
      S.cols=S.rows.length?Object.keys(S.rows[0]):[];
      S.meta={at:lm?new Date(lm):new Date()};
    }
    S.metas={};try{const m=await getText(METAS_URL);parseCsv(await m.text()).slice(1).forEach(r=>{if(r[0])S.metas[r[0].trim().toUpperCase()]={G:num(r[1])||0,M:num(r[2])||0,T:num(r[3])}})}catch(e){}
    fileTrat={};try{const t=await getText(TRAT_URL);parseCsv(await t.text()).slice(1).forEach(r=>{if(r[0])fileTrat[r[0]]={t:r[1]||'PENDENTE',o:r[2]||''}})}catch(e){}
    mergeTrat();S.ok=true;render();
  }catch(e){
    $('#meta').textContent='Erro ao carregar a base: '+(e.message||e);
    if(!silent)$('#app').innerHTML='<div class="note">Não foi possível carregar <b>'+BASE_URL+'</b>. </div>';
  }
}
function saveTrat(r,patch){
  const k=key(r),cur={...tr(r),...patch};S.trat[k]=cur;
  try{const l=JSON.parse(localStorage.getItem(LS)||'{}');l[k]=cur;localStorage.setItem(LS,JSON.stringify(l))}catch(e){alert('Não foi possível salvar neste navegador.')}
}
const qv=v=>{v=v==null?'':String(v);return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function toCsv(rows,cols,fn){return '\ufeff'+[cols.join(';')].concat(rows.map(r=>cols.map(c=>qv(fn?fn(r,c):r[c])).join(';'))).join('\r\n')}
function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function exportBase(){
  if(!S.rows.length)return;
  dl('BASE_PERDAS_'+(S.rows[0].REFERENCIA||'')+'.csv',toCsv(S.rows,S.cols.concat(['TRATATIVA','OBSERVACAO_TRATATIVA']),(r,c)=>c==='TRATATIVA'?(P(r)>0&&r.STATUS_PERDA==='COM PERDA'?tr(r).t:''):c==='OBSERVACAO_TRATATIVA'?tr(r).o:r[c]));
}
function exportAgent(a){
  const rs=rowsFor('v5').filter(x=>x.NOME_AGENTE===a);
  dl('APONTAMENTOS_'+a.replace(/[^A-Za-z0-9]+/g,'_')+'.csv',toCsv(rs,S.cols));
}

/* ---------- filtros / helpers ---------- */
function rowsFor(tab){
  let r=S.rows;
  if(S.sec)r=r.filter(x=>x.SECCIONAL===S.sec);
  const st=S.st[tab];if(st)r=r.filter(x=>x.STATUS_PERDA===st);
  if(tab==='v2'||tab==='v3')r=r.filter(x=>P(x)>0);
  return r;
}
function filters(tab,extra=''){
  return `<div class="bar"><label>Seccional<select data-f="sec"><option value="">Todas</option>${uniq(S.rows.map(r=>r.SECCIONAL)).map(s=>`<option ${s===S.sec?'selected':''}>${esc(s)}</option>`).join('')}</select></label>
  <label>Status da perda<select data-f="st"><option value="">Todos</option>${uniq(S.rows.map(r=>r.STATUS_PERDA)).map(s=>`<option ${s===S.st[tab]?'selected':''}>${esc(s)}</option>`).join('')}</select></label>${extra}</div>`;
}
const pgSel=()=>`<label>Linhas exibidas<select data-f="pg">${[['100','100'],['250','250'],['500','500'],['0','Todas']].map(([v,l])=>`<option value="${v}" ${v===S.pg?'selected':''}>${l}</option>`).join('')}</select></label>`;
const lim=r=>+S.pg>0?r.slice(0,+S.pg):r;
const kpis=a=>`<div class="kpis">${a.map(([l,v,c])=>`<div class="kpi ${c||''}"><small>${l}</small><div>${v}</div></div>`).join('')}</div>`;
const dv=(v,m)=>{const d=v-m;return `<td class="n ${d>0?'up':'dn'}">${d>0?'▲ +':d<0?'▼ −':''}${N(Math.abs(d))}</td>`};
const trip=(v,m)=>`<td class="n sep"><b>${N(v)}</b></td><td class="n me">${N(m)}</td>${dv(v,m)}`;
const th3=l=>`<th class="c" colspan="3">${l}</th>`;
const sub3=l=>`<th class="n">${l}</th><th class="n">Meta</th><th class="n">Desvio</th>`;
const DEVHINT='<div class="hint">Desvio = realizado − meta. Quanto menor, melhor: <span class="dn">▼ verde</span> está dentro/abaixo da meta, <span class="up">▲ vermelho</span> está acima.<b></b>.</div>';

/* ---------- visões ---------- */
const V={};
V.v1=()=>{
  const r=rowsFor('v1'),secs=uniq(r.map(x=>x.SECCIONAL)),m={};secs.forEach(s=>m[s]={G:0,M:0,O:0});
  r.forEach(x=>{const o=m[x.SECCIONAL],g=x.GRUPOS_CNL;o[g===GG?'G':g===GM?'M':'O']+=P(x)});
  const tot=s=>m[s].G+m[s].M+m[s].O;secs.sort((a,b)=>tot(b)-tot(a));
  const hasO=secs.some(s=>m[s].O),mx=Math.max(1,...secs.map(tot));
  const T={G:0,M:0,O:0,mG:0,mM:0,mT:0};secs.forEach(s=>{T.G+=m[s].G;T.M+=m[s].M;T.O+=m[s].O;T.mG+=meta(s,'G');T.mM+=meta(s,'M');T.mT+=meta(s,'T')});
  const TT=T.G+T.M+T.O;
  const row=s=>`<tr><td><b>${esc(s)}</b></td>${trip(m[s].G,meta(s,'G'))}${trip(m[s].M,meta(s,'M'))}${hasO?`<td class="n sep">${N(m[s].O)}</td>`:''}${trip(tot(s),meta(s,'T'))}</tr>`;
  return filters('v1')+kpis([['Perda definitiva (kWh)',N(TT),'w'],['Gestão',N(T.G)],['Medição',N(T.M)],['Meta total',N(T.mT),'g'],['Desvio total',(TT-T.mT>0?'▲ +':'▼ −')+N(Math.abs(TT-T.mT)),TT-T.mT>0?'r':'g']])+
  `<div class="card"><div class="legend"><span><i style="background:var(--ac)"></i>Gestão</span><span><i style="background:var(--ac2)"></i>Medição</span>${hasO?'<span><i style="background:var(--mu)"></i>Outros</span>':''}</div>
  <div style="padding:12px 16px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center">${secs.map(s=>`<b>${esc(s)}</b><div class="stk" style="width:${tot(s)/mx*100}%"><b style="width:${tot(s)?m[s].G/tot(s)*100:0}%;background:var(--ac)"></b><b style="width:${tot(s)?m[s].M/tot(s)*100:0}%;background:var(--ac2)"></b><b style="width:${tot(s)?m[s].O/tot(s)*100:0}%;background:var(--mu)"></b></div><span>${N(tot(s))}</span>`).join('')}</div></div>
  <div class="card"><div class="tw free" style="overflow-x:auto"><table><thead><tr><th rowspan="2">Seccional</th>${th3('Gestão')}${th3('Medição')}${hasO?'<th class="c" rowspan="2">Outros</th>':''}${th3('Total')}</tr><tr>${sub3('Perda')}${sub3('Perda')}${sub3('Perda')}</tr></thead>
  <tbody>${secs.map(row).join('')||'<tr><td colspan="10" class="mu">Sem dados.</td></tr>'}<tr class="t"><td>Total geral</td>${trip(T.G,T.mG)}${trip(T.M,T.mM)}${hasO?`<td class="n sep">${N(T.O)}</td>`:''}${trip(TT,T.mT)}</tr></tbody></table></div></div>`+DEVHINT;
};
V.v2=()=>{
  let r=rowsFor('v2');const base=r;
  if(S.tr)r=r.filter(x=>tr(x).t===S.tr);
  if(S.q){const q=S.q.toLowerCase();r=r.filter(x=>[x.INSTALACAO,x.MUNICIPIO,x.MEDIDOR,x.NOME_AGENTE].join(' ').toLowerCase().includes(q))}
  r=[...r].sort((a,b)=>P(b)-P(a));
  const cnt=o=>base.filter(x=>tr(x).t===o).length;
  const ex=`<label>Tratativa<select data-f="tr"><option value="">Todas</option>${OPT.map(o=>`<option ${o===S.tr?'selected':''}>${o}</option>`).join('')}</select></label><label>Buscar<input type="search" data-f="q" value="${esc(S.q)}" placeholder="instalação, município, agente…"></label>${pgSel()}`;
  const H=['SECCIONAL','MUNICIPIO','INSTALACAO','STATUS_COMERCIAL','MEDIDOR','UNIDADE_LEITURA','PERDA DEFINITIVA','APONTAMENTO','GRUPOS_CNL','SUCESSIVIDADE','NOME_AGENTE'],R=lim(r);
  return filters('v2',ex)+kpis([['Instalações com perda',N(base.length),'w'],['Pendentes',N(cnt('PENDENTE')),'r'],['Não refatura',N(cnt('NÃO REFATURA'))],['Enviado p/ refaturamento',N(cnt('ENVIADO PARA REFATURAMENTO')),'g']])+
  `<div class="card"><div class="tw"><table><thead><tr>${H.map(h=>`<th class="${h==='PERDA DEFINITIVA'||h==='SUCESSIVIDADE'?'n':''}">${h.replace('_',' ')}</th>`).join('')}<th>Tratativa</th><th>Observação</th></tr></thead><tbody>
  ${R.map(x=>{const t=tr(x);return `<tr data-k="${esc(key(x))}">${H.map(h=>`<td class="${h==='PERDA DEFINITIVA'||h==='SUCESSIVIDADE'?'n':''}">${esc(x[h])}</td>`).join('')}<td><select data-t>${OPT.map(o=>`<option ${o===t.t?'selected':''}>${o}</option>`).join('')}</select></td><td><input type="text" data-o value="${esc(t.o)}" placeholder="Observação…"></td></tr>`}).join('')||'<tr><td colspan="13" class="mu">Nenhum registro.</td></tr>'}</tbody></table></div></div>
  <div class="hint">Exibindo ${R.length} de ${r.length} registros — role a tabela para baixo para ver os demais (ou escolha “Todas” em Linhas exibidas). Somente COM PERDA e perda definitiva &gt; 0.</div>`;
};
V.v3=()=>{
  const r=rowsFor('v3'),opts=uniq([...OPT,...Object.values(S.trat).map(t=>t.t)]),cat=x=>!!S.inc[tr(x).t];
  const secs=uniq(r.map(x=>x.SECCIONAL)),L=secs.map(s=>{const g=y=>r.filter(x=>x.SECCIONAL===s&&x.GRUPOS_CNL===y);
    return {s,G:sum(g(GG)),M:sum(g(GM)),dG:sum(g(GG).filter(cat)),dM:sum(g(GM).filter(cat))}}).sort((a,b)=>(b.G+b.M)-(a.G+a.M));
  const T=L.reduce((a,l)=>({G:a.G+l.G,M:a.M+l.M,dG:a.dG+l.dG,dM:a.dM+l.dM,mG:a.mG+meta(l.s,'G'),mM:a.mM+meta(l.s,'M'),mT:a.mT+meta(l.s,'T')}),{G:0,M:0,dG:0,dM:0,mG:0,mM:0,mT:0});
  const row=(l,t)=>{const pG=l.G-l.dG,pM=l.M-l.dM,mG=t?T.mG:meta(l.s,'G'),mM=t?T.mM:meta(l.s,'M'),mT=t?T.mT:meta(l.s,'T'),at=l.G+l.M,rc=l.dG+l.dM;
    return `<tr class="${t?'t':''}"><td><b>${esc(l.s)}</b></td><td class="n sep">${N(l.G)}</td><td class="n">${N(l.M)}</td><td class="n">${N(at)}</td><td class="n sep dn">${rc?'− '+N(rc):'0'}</td>${trip(pG,mG)}${trip(pM,mM)}${trip(pG+pM,mT)}<td class="n sep">${at?(rc/at*100).toFixed(1):'0.0'}%</td></tr>`};
  const at=T.G+T.M,rc=T.dG+T.dM,pr=at-rc;
  const chips=opts.map(o=>{const rs=r.filter(x=>tr(x).t===o);return `<label class="chip ${S.inc[o]?'on':''}"><input type="checkbox" data-inc="${esc(o)}" ${S.inc[o]?'checked':''}>${esc(o)} <span>${rs.length} inst. · ${N(sum(rs))} kWh</span></label>`}).join('');
  return filters('v3')+`<div class="bar" style="flex-direction:column;align-items:stretch;gap:8px"><label>Tratativas que abatem a perda (marque / desmarque para recalcular)</label><div class="chips">${chips}</div></div>`+
  kpis([['Perda atual (kWh)',N(at),'w'],['Recuperação prevista',N(rc),'g'],['Previsão de fechamento',N(pr)],['Meta total',N(T.mT)],['Desvio previsto',(pr-T.mT>0?'▲ +':'▼ −')+N(Math.abs(pr-T.mT)),pr-T.mT>0?'r':'g']])+
  `<div class="card"><div class="tw free" style="overflow-x:auto"><table><thead><tr><th rowspan="2">Seccional</th><th class="c" colspan="3">Perda atual</th><th class="c" rowspan="2">Recuperação</th>${th3('Gestão prevista')}${th3('Medição prevista')}${th3('Total previsto')}<th class="c" rowspan="2">% rec.</th></tr><tr><th class="n">Gestão</th><th class="n">Medição</th><th class="n">Total</th>${sub3('Prev.')}${sub3('Prev.')}${sub3('Prev.')}</tr></thead><tbody>${L.map(l=>row(l)).join('')||'<tr><td colspan="16" class="mu">Sem dados.</td></tr>'}${row({s:'Total geral',...T},1)}</tbody></table></div></div>
  <div class="hint">Previsão = perda definitiva (Gestão e Medição) − perda das instalações cuja <b>coluna Tratativa</b> estiver marcada acima. As opções são lidas das tratativas existentes.</div>`+DEVHINT;
};
V.v4=()=>{
  const r=rowsFor('v4'),secs=uniq(r.map(x=>x.SECCIONAL)),cols=uniq(r.map(x=>x.GRUPOS_CNL)),m={};secs.forEach(s=>m[s]={});
  r.forEach(x=>m[x.SECCIONAL][x.GRUPOS_CNL]=(m[x.SECCIONAL][x.GRUPOS_CNL]||0)+1);
  const tot=s=>cols.reduce((a,c)=>a+(m[s][c]||0),0),mx=Math.max(1,...secs.flatMap(s=>cols.map(c=>m[s][c]||0))),mt=Math.max(1,...secs.map(tot)),ct=c=>secs.reduce((a,s)=>a+(m[s][c]||0),0);
  secs.sort((a,b)=>tot(b)-tot(a));
  return filters('v4')+kpis([['Apontamentos',N(r.length),'w'],...cols.map(c=>[c,N(ct(c))]),['Seccionais',secs.length,'g']])+
  `<div class="card"><div class="tw free"><table><thead><tr><th>Seccional</th>${cols.map(c=>`<th class="n">${esc(c)}</th>`).join('')}<th class="n">Total</th><th style="width:22%"></th></tr></thead><tbody>${secs.map(s=>`<tr><td><b>${esc(s)}</b></td>${cols.map(c=>{const v=m[s][c]||0;return `<td class="n" style="background:color-mix(in srgb,var(--ac) ${Math.round(v/mx*40)}%,transparent)">${v||'<span class="mu">–</span>'}</td>`}).join('')}<td class="n"><b>${tot(s)}</b></td><td><div class="db" style="width:${tot(s)/mt*100}%"></div></td></tr>`).join('')}<tr class="t"><td>Total geral</td>${cols.map(c=>`<td class="n">${ct(c)}</td>`).join('')}<td class="n">${r.length}</td><td></td></tr></tbody></table></div></div>`;
};
V.v5=()=>{
  const r=rowsFor('v5'),m={};r.forEach(x=>(m[x.NOME_AGENTE]=m[x.NOME_AGENTE]||[]).push(x));
  const L=Object.entries(m).sort((a,b)=>b[1].length-a[1].length),mx=L.length?L[0][1].length:1;
  return filters('v5',`<button class="btn" data-all="1">⬇ CSV de todos os agentes</button>`)+kpis([['Agentes',L.length,'g'],['Apontamentos',N(r.length),'w'],['Média por agente',(r.length/(L.length||1)).toFixed(1)]])+
  `<div class="card"><div class="tw"><table><thead><tr><th>#</th><th>Agente</th><th class="n">Apontamentos</th><th style="width:30%"></th><th></th></tr></thead><tbody>${L.map(([a,v],i)=>`<tr class="cl" data-csv="${esc(a)}" title="Clique para baixar o CSV deste agente"><td>${i+1}</td><td><button class="ex" data-exp="${esc(a)}" title="Ver instalações">${S.open===a?'▾':'▸'}</button><b>${esc(a)}</b></td><td class="n"><b>${v.length}</b></td><td><div class="db" style="width:${v.length/mx*100}%"></div></td><td><span class="pill ac">⬇ CSV</span></td></tr>
  ${S.open===a?`<tr class="sub-t"><td></td><td colspan="4"><table><thead><tr><th>Instalação</th><th>Apontamento</th><th>Seccional</th><th class="n">Perda def.</th></tr></thead><tbody>${v.map(x=>`<tr><td>${esc(x.INSTALACAO)}</td><td>${esc(x.APONTAMENTO)}</td><td>${esc(x.SECCIONAL)}</td><td class="n">${N(P(x))}</td></tr>`).join('')}</tbody></table></td></tr>`:''}`).join('')}</tbody></table></div></div>
  <div class="hint">Clique na linha do agente para extrair o CSV com todas as colunas da base (respeitando os filtros acima). Use a seta ▸ para ver instalação e apontamento na tela.</div>`;
};
V.v6=()=>{
  let r=rowsFor('v6');const st=x=>!x.ANT1?'sem':(String(x.ANT1).trim()===cod(x)?'man':'tro'),all=r;
  if(S.sit)r=r.filter(x=>st(x)===S.sit);
  const c=k=>all.filter(x=>st(x)===k).length,lab={tro:['Trocou','wr'],man:['Manteve','ok'],sem:['Sem histórico','ac']},R=lim(r);
  const ex=`<label>Situação<select data-f="sit"><option value="">Todas</option><option value="tro" ${S.sit==='tro'?'selected':''}>Trocou</option><option value="man" ${S.sit==='man'?'selected':''}>Manteve</option><option value="sem" ${S.sit==='sem'?'selected':''}>Sem histórico</option></select></label>${pgSel()}`;
  return filters('v6',ex)+kpis([['Trocaram',c('tro'),'w'],['Mantiveram',c('man'),'g'],['% de troca',(all.length?c('tro')/all.length*100:0).toFixed(1)+'%','r']])+
  `<div class="card"><div class="tw"><table><thead><tr><th>ANT1</th><th>APONTAMENTO (3 primeiros)</th><th>Situação</th></tr></thead><tbody>${R.map(x=>{const l=lab[st(x)];return `<tr><td><b>${esc(x.ANT1)}</b></td><td><b>${esc(cod(x))}</b></td><td><span class="pill ${l[1]}">${l[0]}</span></td></tr>`}).join('')||'<tr><td colspan="3" class="mu">Nenhum registro.</td></tr>'}</tbody></table></div></div>
  <div class="hint">Exibindo ${R.length} de ${r.length}. Regra: ANT1 diferente do código (3 primeiros caracteres) do APONTAMENTO = trocou; igual = manteve.</div>`;
};
V.v7=()=>kpis([['Registros',N(S.rows.length),'w'],['Referência',S.rows[0]?S.rows[0].REFERENCIA:'–'],['Base atualizada em',S.meta?S.meta.at.toLocaleString('pt-BR'):'–'],['Seccionais',uniq(S.rows.map(x=>x.SECCIONAL)).length,'g']])+
 `<div class="card" style="padding:18px"><p>O site lê <b>dados/BASE_PERDAS.xlsx</b> (base) e <b>dados/METAS.csv</b> (metas por seccional). Para atualizar, substitua os arquivos no servidor — o site recarrega sozinho em até 5 minutos. Ninguém altera a base pela tela.</p><button class="btn" id="csv2">⬇ Exportar base completa (CSV)</button>
 <hr style="border:0;border-top:1px solid var(--bd);margin:18px 0"><p><b>Tratativas</b> ficam salvas neste navegador. Exporte para compartilhar e publique o arquivo como <b>dados/tratativas.csv</b>.</p>
 <button class="btn" id="tx">⬇ Exportar tratativas</button> <label class="btn" style="display:inline-flex;flex-direction:row;text-transform:none;letter-spacing:0;font-size:14px;color:var(--tx)">⬆ Importar tratativas<input type="file" id="ti" accept=".csv" hidden></label></div>`;

/* ---------- render / eventos ---------- */
function render(reset){
  const t=TABS.find(x=>x[0]===S.tab);
  $('#nav').innerHTML=TABS.map(([k,n,i])=>`<button class="nv ${k===S.tab?'on':''}" data-tab="${k}" title="${n}"><i>${i}</i><span class="lbl">${n}</span></button>`).join('');
  $('#ttl').textContent=t[1];$('#tsub').textContent=t[3];
  const sc=$('.tw'),top=sc&&!reset?sc.scrollTop:0,left=sc&&!reset?sc.scrollLeft:0;
  $('#app').innerHTML=S.ok?V[S.tab]():'';
  const n=$('.tw');if(n&&(top||left)){n.scrollTop=top;n.scrollLeft=left}
  if(S.ok)$('#meta').textContent=`Referência ${S.rows[0]?S.rows[0].REFERENCIA:'–'} · ${N(S.rows.length)} registros · base atualizada em ${S.meta.at.toLocaleString('pt-BR')}`;
}
document.addEventListener('click',e=>{
  const g=id=>e.target.closest(id),el=e.target;
  const t=g('[data-tab]');if(t){S.tab=t.dataset.tab;S.open=null;document.body.classList.remove('open');render(true);window.scrollTo(0,0);return}
  const ex=g('[data-exp]');if(ex){const a=ex.dataset.exp;S.open=S.open===a?null:a;render();return}
  const cs=g('[data-csv]');if(cs){exportAgent(cs.dataset.csv);return}
  if(g('[data-all]')){dl('APONTAMENTOS_TODOS_AGENTES.csv',toCsv(rowsFor('v5'),S.cols));return}
  const b=el.closest('button,label'),id=b?b.id:'';
  if(id==='csv'||id==='csv2')exportBase();
  else if(id==='reload')loadBase();
  else if(id==='tx')dl('tratativas.csv',toCsv(Object.entries(S.trat),['CHAVE','TRATATIVA','OBSERVACAO'],(en,c)=>c==='CHAVE'?en[0]:c==='TRATATIVA'?en[1].t:en[1].o||''));
  else if(id==='theme'){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('perdas_theme',d.dataset.theme)}catch(x){}}
  else if(id==='collapse'||id==='expand'){document.body.classList.toggle('col');try{localStorage.setItem('perdas_col',document.body.classList.contains('col')?1:0)}catch(x){}}
  else if(id==='burger')document.body.classList.add('open');
  else if(el.id==='ov')document.body.classList.remove('open');
});
document.addEventListener('change',e=>{
  const el=e.target,f=el.dataset.f;
  if(f){if(f==='st')S.st[S.tab]=el.value;else S[f]=el.value;render();return}
  if(el.dataset.inc!==undefined){S.inc[el.dataset.inc]=el.checked;render();return}
  const row=el.closest('tr[data-k]');
  if(row&&(el.dataset.t!==undefined||el.dataset.o!==undefined)){
    const r=S.rows.find(x=>key(x)===row.dataset.k);if(!r)return;
    saveTrat(r,el.dataset.t!==undefined?{t:el.value}:{o:el.value});if(el.dataset.t!==undefined)render();return}
  if(el.id==='ti'&&el.files[0]){const rd=new FileReader();rd.onload=()=>{let l={};try{l=JSON.parse(localStorage.getItem(LS)||'{}')}catch(x){}let n=0;
    parseCsv(rd.result).slice(1).forEach(r=>{if(r[0]){l[r[0]]={t:OPT.includes(r[1])?r[1]:'PENDENTE',o:r[2]||''};n++}});
    localStorage.setItem(LS,JSON.stringify(l));mergeTrat();render();alert(n+' tratativas importadas.')};rd.readAsText(el.files[0])}
});
document.addEventListener('input',e=>{if(e.target.dataset.f==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const i=$('[data-f=q]');i.focus();i.setSelectionRange(p,p)}});
try{const th=localStorage.getItem('perdas_theme');if(th)document.documentElement.dataset.theme=th;if(localStorage.getItem('perdas_col')==='1')document.body.classList.add('col')}catch(e){}
render();loadBase();
setInterval(()=>{const a=(document.activeElement||{}).tagName||'';if(!/INPUT|SELECT/.test(a))loadBase(true)},300000);
</script>
</body>
